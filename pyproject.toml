[project]
name = "agent-control-plane"
dynamic = ["version"]
description = "Git work safety, crash recovery, and independent QC for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.116,<1",
  "pyjwt>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/Rayha33/agent-control-plane"
Repository = "https://github.com/Rayha33/agent-control-plane"
Issues = "https://github.com/Rayha33/agent-control-plane/issues"
Security = "https://github.com/Rayha33/agent-control-plane/security/policy"

[project.scripts]
acp = "agent_control_plane.cli:main"
acp-trust-helper = "agent_control_plane.trust_helper:main"

[project.optional-dependencies]
# The multi-host PostgreSQL backend (board #568). Optional: the single-host SQLite default
# needs nothing beyond the standard library.
postgres = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx2>=2.12,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pytest-cov>=7,<8",
  "pytest>=9.0.3,<10",
  "ruff>=0.15.8,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent_control_plane/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_plane"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "linux_worker: needs the Linux child-subreaper/proc worker path; must run on a Linux CI job",
  "storage_portable: runs once per storage backend when ACP_TEST_POSTGRES_URL is set",
  "postgres_backend: needs a live PostgreSQL server (ACP_TEST_POSTGRES_URL)",
]
testpaths = ["tests"]
# Starlette 1.6.0 deprecated the `httpx` transport for starlette.testclient and will
# eventually drop it; the dev extra pins httpx2 so TestClient uses the supported
# transport. Promoted to an error so a future regression (httpx2 dropped from the
# environment, or a new Starlette deprecation ACP actually triggers) fails CI loudly
# instead of scrolling past as one line of warning summary.
#
# NOTE: StarletteDeprecationWarning subclasses UserWarning, NOT DeprecationWarning
# (starlette/exceptions.py:36), so `-W error::DeprecationWarning` does NOT catch it.
# Measured 2026-09-03 with httpx2 uninstalled: `-o filterwarnings=error::Deprecation
# Warning` still exited 0 with the warning merely reported, while this filter exited 4
# at conftest import. The filter is therefore load-bearing, not decorative.
filterwarnings = [
  "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Default pyflakes/pycodestyle set plus bugbear, import order and pyupgrade.
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Header() in parameter defaults is the framework idiom.
"src/agent_control_plane/app.py" = ["B008"]
