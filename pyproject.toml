[project]
name = "agent-control-plane"
dynamic = ["version"]
description = "Git work safety, crash recovery, and independent QC for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.116,<1",
  "pyjwt>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/Rayha33/agent-control-plane"
Repository = "https://github.com/Rayha33/agent-control-plane"
Issues = "https://github.com/Rayha33/agent-control-plane/issues"
Security = "https://github.com/Rayha33/agent-control-plane/security/policy"

[project.scripts]
acp = "agent_control_plane.cli:main"
acp-trust-helper = "agent_control_plane.trust_helper:main"

[project.optional-dependencies]
dev = [
  "hatchling==1.32.4",
  "httpx2>=2.12,<3",
  "httpx>=0.28,<1",
  "pytest-cov>=7,<8",
  "pytest>=9.0.3,<10",
  "ruff>=0.15.8,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.12.21"
# PEP 517 builds are isolated from uv.lock; pin and hash the full Hatchling closure.
build-constraint-dependencies = [
  { requirement = "hatchling==1.32.4", hashes = ["sha256:c4468f73144c054d2aab4ef0f0378c43b9878bf07f8ffd6b79690e970d375f07", "sha256:08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c"] },
  { requirement = "packaging==26.3", hashes = ["sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79", "sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"] },
  { requirement = "pathspec==1.1.1", hashes = ["sha256:17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a", "sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"] },
  { requirement = "pluggy==1.6.0", hashes = ["sha256:7dcc130b76258d33b90f61b658791dede3486c3e6bfb003ee5c9bfb396dd22f3", "sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746"] },
  { requirement = "tomlkit==0.15.1", hashes = ["sha256:e25bbf38843005246210a12982776f27f99cb9be67160e14434d0c0d21ee1e97", "sha256:177a05aece5a8ca5266fd3c448abb47b8d352f09d477d3ca8332db4d89b24304"] },
  { requirement = "trove-classifiers==2026.9.21.13", hashes = ["sha256:0a9ebc8d4e2f3e8a22848c5258033035bec17a3012ac3fea16dbaa764489eb71", "sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17"] },
]

[tool.hatch.version]
path = "src/agent_control_plane/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_plane"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "linux_worker: needs the Linux child-subreaper/proc worker path; must run on a Linux CI job",
]
testpaths = ["tests"]
# Starlette 1.6.0 deprecated the `httpx` transport for starlette.testclient and will
# eventually drop it; the dev extra pins httpx2 so TestClient uses the supported
# transport. Promoted to an error so a future regression (httpx2 dropped from the
# environment, or a new Starlette deprecation ACP actually triggers) fails CI loudly
# instead of scrolling past as one line of warning summary.
#
# NOTE: StarletteDeprecationWarning subclasses UserWarning, NOT DeprecationWarning
# (starlette/exceptions.py:36), so `-W error::DeprecationWarning` does NOT catch it.
# Measured 2026-09-03 with httpx2 uninstalled: `-o filterwarnings=error::Deprecation
# Warning` still exited 0 with the warning merely reported, while this filter exited 4
# at conftest import. The filter is therefore load-bearing, not decorative.
filterwarnings = [
  "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Default pyflakes/pycodestyle set plus bugbear, import order and pyupgrade.
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Header() in parameter defaults is the framework idiom.
"src/agent_control_plane/app.py" = ["B008"]
